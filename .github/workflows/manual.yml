name: Develop Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: ${{ secrets.ConnectionStrings__DefaultConnection }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start containers from root compose
        run: docker compose up -d --build

      - name: Build .NET application
        working-directory: apps/server/src/Dystopian-Civil-Office/Dystopian-Civil-Office
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Run .NET application
        working-directory: apps/server/src/Dystopian-Civil-Office/Dystopian-Civil-Office
        run: |
          dotnet run --configuration Release &
          sleep 20

      - name: Build Angular application
        working-directory: apps/client/Dystopian-Civil-Office
        run: |
          npm ci
          npm run build

      - name: Run Angular application
        working-directory: apps/client/Dystopian-Civil-Office
        run: |
          npx ng serve --host 0.0.0.0 --port 4200 &
          sleep 30

      - name: Show running containers
        run: docker compose ps
