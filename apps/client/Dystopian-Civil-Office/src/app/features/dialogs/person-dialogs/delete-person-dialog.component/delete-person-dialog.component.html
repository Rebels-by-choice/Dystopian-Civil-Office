<app-dialog-shell
  title="Delete person"
  subtitle="Are you sure you want to delete this person?"
  [errorMessage]="apiErrorMessage"
>
  <div dialog-body>
    <div class="mb-5 rounded-xl border border-red-500/30 bg-dco-bg-error px-4 py-4 text-center">
      <p class="text-lg">
        <span class="font-semibold text-dco-dialog-delete-name"
          >{{ data.firstName }} {{ data.lastName }}</span
        >
      </p>
      <p class="mt-1 text-xs text-color-dco-dialog-subtitle">PESEL: {{ data.personPesel }}</p>
    </div>
    <p class="text-sm text-center text-color-dco-dialog-subtitle">
      All data associated with this person will be deleted.
    </p>
  </div>

  <div dialog-actions>
    <app-button label="Cancel" variant="secondary" (buttonClick)="onCancel()"></app-button>
    <app-button label="OK" [disabled]="isSubmitting" (buttonClick)="onConfirm()"></app-button>
  </div>
</app-dialog-shell>
