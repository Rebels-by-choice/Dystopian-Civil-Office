<div class="w-[460px] max-w-[92vw] rounded-2xl bg-zinc-900 p-6 text-zinc-100 shadow-2xl">
  <div class="mb-6 text-center">
    <h2 class="text-3xl font-semibold">Create document</h2>
    <p class="mt-2 text-sm text-zinc-400">Fill in the required values and confirm.</p>
  </div>

  <form [formGroup]="form" class="flex flex-col gap-4">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label class="!pl-2">Name</mat-label>
      <input matInput formControlName="name" maxlength="300" class="!pl-2 !text-base" />
      @if (nameError) {
        <mat-error class="!text-[#F28A8A]">{{ nameError }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label class="!pl-2">Category</mat-label>
      <input matInput formControlName="category" maxlength="100" class="!pl-2 !text-base" />
      @if (categoryError) {
        <mat-error class="!text-[#F28A8A]">{{ categoryError }}</mat-error>
      }
    </mat-form-field>

    @if (apiErrorMessage) {
      <div class="rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-center">
        <p class="text-sm font-medium text-red-300">
          {{ apiErrorMessage }}
        </p>
      </div>
    }

    <div class="mt-2 flex justify-center gap-3">
      <app-button label="Cancel" variant="secondary" (buttonClick)="onCancel()"> </app-button>

      <app-button label="Confirm" [disabled]="isSubmitting" (buttonClick)="onConfirm()">
      </app-button>
    </div>
  </form>
</div>
