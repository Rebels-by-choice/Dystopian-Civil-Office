<div class="flex w-full flex-col justify-center gap-2 rounded-lg bg-gray-600  p-2">
  <select
    (change)="onSelectionChange($event)"
    class="w-full rounded bg-gray-800 p-4 text-white  outline-none">

    <option value="" disabled selected>{{ placeholder }}</option>

    @for (item of users; track item.personId) {
      <option [value]="item.personId + ':' + item.isFunctionary">
        {{ item.lastName }}, {{ item.firstName }} - {{ item.isFunctionary ? 'Functionary' : 'Citizen'}}
      </option>
    }
  </select>
</div>
