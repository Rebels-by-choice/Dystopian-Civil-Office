<div class="w-[460px] max-w-[92vw] rounded-2xl bg-zinc-900 p-6 text-zinc-100 shadow-2xl">
  <div class="mb-6 text-center">
    <h2 class="text-3xl font-semibold text-red-300">Delete document</h2>
    <p class="mt-2 text-sm text-zinc-400">Are you sure you want to delete this document?</p>
    <p class="mt-2 text-sm text-zinc-400">
      All data associated with this document will be deleted.
    </p>
  </div>

  <div class="mb-5 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-4 text-center">
    <p class="text-sm text-zinc-200">
      <span class="font-semibold text-red-200">{{ data.name }}</span>
    </p>
    <p class="mt-1 text-xs text-zinc-400">Category: {{ data.category }}</p>
  </div>

  @if (apiErrorMessage) {
    <div class="mb-4 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-center">
      <p class="text-sm font-medium text-red-300">
        {{ apiErrorMessage }}
      </p>
    </div>
  }

  <div class="mt-2 flex justify-center gap-3">
    <app-button label="Cancel" variant="secondary" (buttonClick)="onCancel()"></app-button>

    <app-button label="OK" [disabled]="isSubmitting" (buttonClick)="onConfirm()"></app-button>
  </div>
</div>
