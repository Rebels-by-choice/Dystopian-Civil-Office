version: '3.8'
services:
  postgres-dbGlobal:
    image: postgres
    container_name: Dystopian-Civil-Office-DB
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: Dystopian-Civil-Office-DB

      POSTGRES_APP_ROLE: clerk
      POSTGRES_APP_PASSWORD: clerk_access12!
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/dco_data
volumes:
  postgres-data:
    external: true