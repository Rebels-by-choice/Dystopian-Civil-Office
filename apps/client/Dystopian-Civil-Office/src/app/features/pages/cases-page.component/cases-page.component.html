<div class="flex flex-col gap-5 w-1/3">
@if (cases$ | async; as cases) {
  @if (cases.length > 0) {
    <p class="text-4xl">You participate in {{ cases.length }} cases.</p>
    <div
      class="flex flex-col gap-2.5 rounded-lg p-4 bg-slate-300">
      @for (c of cases; track c.caseId) {
        <a
          [routerLink]="'/cases/' + c.caseId"
          class="rounded-lg p-4"
             [ngClass]="{
             'bg-green-400': c.statusName === 'Closed',
             'bg-blue-400': c.statusName === 'Open',
             'bg-yellow-400': c.statusName === 'PendingDocuments',
             'bg-slate-400': c.statusName === 'Cancelled',
             }">
          <h3 class="text-3xl">Case #{{ c.caseId }}</h3>
          <p class="text-2xl">{{ c.initiatorName }} with {{ c.responderName }} (Status: {{ c.statusName }})</p>
        </a>
      }
    </div>
  }
  @else {
    <p class="text-4xl">You don't participate in any cases.</p>
  }
}
</div>
