<app-dialog-shell
  title="Delete marriage record"
  subtitle="Are you sure you want to delete this marriage record?"
  [errorMessage]="apiErrorMessage"
>
  <div dialog-body>
    <div class="mb-5 rounded-xl border border-red-500/30 bg-dco-bg-error px-4 py-4 text-center">
      <p class="text-lg">
        <span class="font-semibold text-dco-dialog-delete-name">{{ data.registryNumber }}</span>
      </p>
      <p class="mt-1 text-xs text-color-dco-dialog-subtitle">
        Spouse 1 PESEL: {{ data.spouse1Pesel }}
      </p>
      <p class="mt-1 text-xs text-color-dco-dialog-subtitle">
        Spouse 2 PESEL: {{ data.spouse2Pesel }}
      </p>
      <p class="mt-1 text-xs text-color-dco-dialog-subtitle">
        Marriage date: {{ data.marriageDate | date }}
      </p>
      <p class="mt-1 text-xs text-color-dco-dialog-subtitle">
        Marriage place: {{ data.marriagePlace }}
      </p>
    </div>
    <p class="text-sm text-center text-color-dco-dialog-subtitle">
      All data associated with this marriage record will be deleted.
    </p>
  </div>

  <div dialog-actions>
    <app-button label="Cancel" variant="secondary" (buttonClick)="onCancel()"></app-button>
    <app-button label="OK" [disabled]="isSubmitting" (buttonClick)="onConfirm()"></app-button>
  </div>
</app-dialog-shell>
