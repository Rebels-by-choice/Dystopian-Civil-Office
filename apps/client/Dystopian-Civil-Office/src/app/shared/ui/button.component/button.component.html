<button
  type="button"
  [disabled]="disabled"
  (click)="onClick()"
  class="inline-flex min-h-11 items-center justify-center rounded-xl px-5 text-[13px] font-semibold uppercase tracking-[0.08em] shadow-sm transition disabled:cursor-not-allowed disabled:opacity-60 hover:cursor-pointer"
  [ngClass]="{
    'border border-stone-900 bg-[#0F3604] text-[#fcfafa] hover:bg-[#1B5E08]': variant === 'primary',
    'border border-stone-900 bg-[#4F170A] text-zinc-100 hover:bg-[#691D0C]':
      variant === 'secondary',
  }"
>
  {{ label }}
</button>
