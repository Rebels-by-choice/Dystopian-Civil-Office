@if (case$ | async; as current_case){
  <div class="flex flex-col gap-4">
    <a [routerLink]="'/cases'">< Back to cases</a>
    <h1 class="text-4xl font-bold">Case #{{ current_case.caseId }}</h1>

    <div class="bg-slate-200 p-4 rounded-lg">
      <p class="text-2xl">Status: <span class="font-bold">{{ current_case.statusName }}</span></p>
      <p class="text-xl">Initiator: {{ current_case.initiatorName }}</p>
      <p class="text-xl">Responder: {{ current_case.responderName }}</p>
      <p class="text-gray-600 mt-4">Created: {{ current_case.createdAt }}</p>
    </div>
  </div>
} @else {
  <p class="text-2xl mt-4">Loading case...</p>
}
